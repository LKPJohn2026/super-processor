name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Only github-release (contents: write) and pypi
# (id-token: write, in the pypi environment) get more, and only for themselves.
permissions:
  contents: read

env:
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  CIBW_SKIP: "*-musllinux_* *-win32"
  # Build without isolation so the backend (setuptools, Cython, setuptools-scm)
  # comes from the hash-checked file below, not a fresh unpinned resolve.
  CIBW_BUILD_FRONTEND: "build; args: --no-isolation"
  CIBW_BEFORE_BUILD: "python -m pip install --require-hashes -r {project}/.github/requirements/build.txt"
  CIBW_BEFORE_TEST: "python -m pip install --require-hashes -r {project}/.github/requirements/build.txt"
  CIBW_TEST_COMMAND: "python -m pytest {project}/tests -o addopts="
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Build source distribution
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m build --sdist --no-isolation

      - name: Test source distribution
        run: |
          python -m pip install --no-deps --no-build-isolation dist/*.tar.gz
          super-processor self-test --sample-size 1000

      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install cibuildwheel
        run: python -m pip install --require-hashes -r .github/requirements/tools.txt

      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  verify:
    name: Verify release artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Download source distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-distribution
          path: dist

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Check distribution metadata
        run: |
          python -m pip install --require-hashes -r .github/requirements/tools.txt
          python -m twine check dist/*

  github-release:
    name: Publish GitHub Release
    needs: [verify]
    runs-on: ubuntu-latest
    # The only job with contents: write. It runs nothing but GitHub's own
    # actions and the preinstalled gh CLI.
    permissions:
      contents: write
    steps:
      - name: Download source distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-distribution
          path: dist

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run after a failed upload adds the files to the existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
          fi

  pypi:
    name: Publish to PyPI
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ancient-processor
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download source distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-distribution
          path: dist

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
