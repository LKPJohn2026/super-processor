name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Never inject Gemini_API_Test here — live calls run only in gemini-live.
      - name: Run unit tests
        run: python -m pytest -m "not gemini_live"

      - name: Smoke-test console entry point
        run: super-processor self-test --sample-size 1000

      - name: Smoke-test doctor when FFmpeg is available
        run: super-processor doctor --json

  gemini-live:
    name: Gemini live API
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Require Gemini_API_Test on main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GEMINI_API_KEY: ${{ secrets.Gemini_API_Test }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Repository secret Gemini_API_Test is missing or empty"
            exit 1
          fi

      # List multimodal models with usable RPM (limit != 0), probe until one
      # accepts generateContent, then pin SUPER_PROCESSOR_GEMINI_MODEL for tests.
      - name: Discover Gemini model with usable RPM
        id: gemini_model
        env:
          GEMINI_API_KEY: ${{ secrets.Gemini_API_Test }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY empty; skipping model discovery"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          from super_processor.gemini import GeminiClient, GeminiError

          client = GeminiClient()
          infos = client.list_model_infos()
          candidates = client.candidate_models(refresh=True)
          print(f"listed={len(infos)} candidates={candidates}")
          for info in infos:
              if info.name in candidates:
                  print(
                      f"  {info.name} rpm={info.rpm_used}/{info.rpm_limit} "
                      f"methods={list(info.methods)}"
                  )
          if not candidates:
              raise SystemExit("No multimodal Gemini models with usable RPM")
          try:
              picked = client.pick_working_model()
          except GeminiError as exc:
              raise SystemExit(f"No Gemini model accepted a probe call: {exc}") from exc
          print(f"picked={picked}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SUPER_PROCESSOR_GEMINI_MODEL={picked}\n")
              handle.write(
                  "SUPER_PROCESSOR_GEMINI_CANDIDATES="
                  + ",".join(client.candidate_models())
                  + "\n"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"model={picked}\n")
              handle.write("skipped=false\n")
          PY

      - name: Run live Gemini structured-output tests
        if: steps.gemini_model.outputs.skipped != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.Gemini_API_Test }}
        run: >
          python -m pytest tests/test_gemini_live.py
          -m gemini_live -v --cov-fail-under=0

  package:
    name: Build distributions
    needs: [quality, test, gemini-live]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          super-processor self-test --sample-size 1000

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
