name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $installed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            choco install ffmpeg -y --no-progress
            $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' +
              [System.Environment]::GetEnvironmentVariable('Path','User')
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
              $installed = $true
              break
            }
            Start-Sleep -Seconds (8 * $attempt)
          }
          if (-not $installed) {
            throw 'ffmpeg not available after Chocolatey retries'
          }
          $ffmpegPath = (Get-Command ffmpeg).Source
          $ffmpegDir = Split-Path -Parent $ffmpegPath
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir
          ffmpeg -version

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Never inject Gemini_API_Test here — live calls run only in gemini-live.
      - name: Run unit tests
        run: python -m pytest -m "not gemini_live"

      - name: Smoke-test console entry point
        run: super-processor self-test --sample-size 1000

      - name: Smoke-test doctor when FFmpeg is available
        run: super-processor doctor --json

  frontend:
    name: Frontend regressions and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, test, and build frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      # The app super-processor review serves, built into the package; the
      # package job puts it in the sdist and the wheel.
      - name: Build the web app for the package
        working-directory: web
        run: |
          npm run build:package
          npm run check:package

      - name: Upload the web app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: src/super_processor/web_dist
          if-no-files-found: error

  gemini-live:
    name: Gemini live API
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Require Gemini_API_Test on main pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GEMINI_API_KEY: ${{ secrets.Gemini_API_Test }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Repository secret Gemini_API_Test is missing or empty"
            exit 1
          fi

      # List multimodal models with usable RPM (limit != 0), probe until one
      # accepts generateContent, then pin SUPER_PROCESSOR_GEMINI_MODEL for tests.
      - name: Discover Gemini model with usable RPM
        id: gemini_model
        env:
          GEMINI_API_KEY: ${{ secrets.Gemini_API_Test }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY empty; skipping model discovery"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path

          from super_processor.gemini import GeminiClient, GeminiError

          client = GeminiClient()
          infos = client.list_model_infos()
          candidates = client.candidate_models(refresh=True)
          print(f"listed={len(infos)} candidates={candidates}")
          for info in infos:
              if info.name in candidates:
                  print(
                      f"  {info.name} rpm={info.rpm_used}/{info.rpm_limit} "
                      f"methods={list(info.methods)}"
                  )
          if not candidates:
              raise SystemExit("No multimodal Gemini models with usable RPM")
          try:
              picked = client.pick_working_model()
          except GeminiError as exc:
              raise SystemExit(f"No Gemini model accepted a probe call: {exc}") from exc
          print(f"picked={picked}")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SUPER_PROCESSOR_GEMINI_MODEL={picked}\n")
              handle.write(
                  "SUPER_PROCESSOR_GEMINI_CANDIDATES="
                  + ",".join(client.candidate_models())
                  + "\n"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"model={picked}\n")
              handle.write("skipped=false\n")
          PY

      - name: Run live Gemini structured-output tests
        if: steps.gemini_model.outputs.skipped != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.Gemini_API_Test }}
        run: >
          python -m pytest tests/test_gemini_live.py
          -m gemini_live -v --cov-fail-under=0

  package:
    name: Build distributions
    needs: [quality, test, frontend, gemini-live]
    runs-on: ubuntu-latest
    env:
      # setup.py stops the build if the web app is missing.
      SUPER_PROCESSOR_REQUIRE_WEB_DIST: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Same hash-checked toolchain as release.yml, so a pin or hash that no
      # longer installs fails here before anyone pushes a tag.
      - name: Install build tools
        run: |
          python -m pip install --require-hashes -r .github/requirements/build.txt
          python -m pip install --require-hashes -r .github/requirements/tools.txt

      - name: Download the web app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: src/super_processor/web_dist

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Check the web app is in every distribution
        run: python .github/scripts/check_web_dist.py dist

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          super-processor self-test --sample-size 1000
          python -c "import super_processor.review as r; assert (r.web_dist_dir() / 'index.html').is_file()"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
