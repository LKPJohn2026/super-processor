[build-system]
# Exact pins, kept identical to .github/requirements/build.in. Releases install
# these from the hash-checked .github/requirements/build.txt and build with
# --no-isolation; tests/test_workflow_hardening.py checks the two match.
# setuptools builds wheels itself, so "wheel" is not needed.
requires = [
  "Cython==3.3.0",
  "setuptools==84.2.1",
  "setuptools-scm[toml]==10.3.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "ancient-processor"
dynamic = ["version"]
description = "Local-first AI-assisted video processing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# The wheel ships the web app, which bundles React and three OFL fonts.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Super Processor contributors" },
]
keywords = ["cython", "ffmpeg", "video-processing", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
gpu = [
  "spandrel>=0.4.2,<0.5",
  # 2.6 fixes CVE-2025-32434 (code execution through weights_only=True).
  "torch>=2.6",
]
dev = [
  "Cython>=3.0,<4",
  "build>=1.2.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=6",
  # tests/test_workflow_hardening.py parses the workflow files.
  "PyYAML>=6",
  "ruff>=0.11",
  "setuptools>=77",
  "twine>=5.1",
]

[project.scripts]
super-processor = "super_processor.cli:main"

[project.urls]
Documentation = "https://github.com/LKPJohn2026/super-processor/tree/main/docs"
Issues = "https://github.com/LKPJohn2026/super-processor/issues"
Repository = "https://github.com/LKPJohn2026/super-processor"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# web_dist is the web app (`npm run build:package` in web/); it is not in
# git, and CI and the release build it before making the sdist and wheels.
super_processor = [
  "*.pyi",
  "py.typed",
  "web_dist/*.html",
  "web_dist/assets/*",
]

[tool.setuptools.exclude-package-data]
# Only the Cython annotation: "*.html" would also drop web_dist/index.html.
super_processor = ["*.c", "*.pyx", "_core.html"]

[tool.setuptools_scm]
fallback_version = "0.0.dev0"
version_file = "src/super_processor/_version.py"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=super_processor",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
]
testpaths = ["tests"]
filterwarnings = ["error"]
markers = [
  "gemini_live: calls the real Gemini API (needs GEMINI_API_KEY / Gemini_API_Test)",
  "gpu: runs SPAN on a CUDA GPU (needs torch; skipped without it)",
]

[tool.coverage.run]
branch = true
source = ["super_processor"]
omit = [
  "*/super_processor/__main__.py",
  "*/super_processor/_version.py",
  "src/super_processor/__main__.py",
  "src/super_processor/_version.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["src/super_processor/_version.py"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
files = ["src/super_processor", "tests"]
mypy_path = "src"
strict = true
exclude = ["src/super_processor/_version.py"]
